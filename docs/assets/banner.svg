<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">SpareLine</title>
  <desc id="d">Keep talking when the cloud goes down. Self-hosted, end-to-end encrypted chat for your office network.</desc>
  <style>
    .bg { fill: #f3f5f3; }
    .rule { fill: #d8dfdb; }
    .ink { fill: #17201d; }
    .muted { fill: #59645f; }
    .signal { fill: #1b7a5c; }
    .word { font: 800 76px "Atkinson Hyperlegible Next", "Segoe UI", -apple-system, system-ui, sans-serif; letter-spacing: -1.5px; }
    .tag { font: 600 30px "Atkinson Hyperlegible Next", "Segoe UI", -apple-system, system-ui, sans-serif; }
    .sub { font: 400 21px "Atkinson Hyperlegible Next", "Segoe UI", -apple-system, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111715; }
      .rule { fill: #2b3734; }
      .ink { fill: #e7ede9; }
      .muted { fill: #98a59f; }
      .signal { fill: #4cc596; }
    }
  </style>
  <rect class="bg" width="1200" height="300" rx="24"/>
  <!-- The mark: the main line and the spare line. -->
  <rect class="ink" x="80" y="112" width="190" height="18" rx="9"/>
  <rect class="signal" x="80" y="152" width="130" height="18" rx="9"/>
  <text class="word ink" x="318" y="160">SpareLine</text>
  <text class="tag ink" x="320" y="212">Keep talking when the cloud goes down.</text>
  <text class="sub muted" x="320" y="250">Self-hosted, end-to-end encrypted chat for your office network.</text>
</svg>
