<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d">
  <title id="t">How SpareLine works</title>
  <desc id="d">When your usual cloud chat, email and meetings are down, staff computers keep talking to a SpareLine Server on one office computer, over your own office network with no internet needed. Numbers match the steps in the README. 1: the server passes on sealed messages and holds them for offline devices. 2: its control panel handles invites, groups and health, with no way to read messages. 3: staff computers join with a one-time invite, check it's the real server, seal messages before sending and store history encrypted. 4: the spare line between staff and the server is an encrypted TLS connection on port 7443, locked to the server's certificate, and the app finds the server by itself. Only the people in a chat can read its messages; the server sees who, when and how much, never what.</desc>
  <style>
    .bg { fill: #f4f4f6; }
    .zone { fill: none; stroke: #c4c5cc; stroke-width: 2; stroke-dasharray: 8 8; }
    .card { fill: #ffffff; stroke: #e7e7eb; stroke-width: 2; }
    .inner { fill: #f7f7f9; stroke: #ececf0; stroke-width: 1.5; }
    .seal { fill: #e8f6ee; }
    .chip { fill: #ffffff; stroke: #26a35f; stroke-width: 2; }
    .cloud { fill: #e4e4e9; }
    .rule { stroke: #e7e7eb; stroke-width: 2; }
    .ink { fill: #1b1c20; }
    .ink-s { stroke: #1b1c20; }
    .ink2 { fill: #3c3e45; }
    .muted { fill: #676a73; }
    .faint-s { stroke: #b4b6bd; }
    .signal { fill: #26a35f; }
    .signal-s { stroke: #26a35f; }
    .fail { fill: #b8401f; }
    .fail-s { stroke: #b8401f; }
    .fail-tint { fill: #fdeee8; }
    .badge { fill: #1b1c20; }
    .badge-t { fill: #ffffff; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif; }
    .h { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
    .h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.2px; }
    .h3 { font-size: 17px; font-weight: 600; }
    .b { font-size: 17px; font-weight: 400; }
    .s { font-size: 16px; font-weight: 400; }
    .pill { font-size: 15px; font-weight: 600; }
    .num { font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d0e10; }
      .zone { stroke: #3a3c43; }
      .card { fill: #17181b; stroke: #25262b; }
      .inner { fill: #1d1e22; stroke: #2a2b30; }
      .seal { fill: #14261c; }
      .chip { fill: #17181b; stroke: #4cb782; }
      .cloud { fill: #1e1f23; }
      .rule { stroke: #25262b; }
      .ink { fill: #ececef; }
      .ink-s { stroke: #ececef; }
      .ink2 { fill: #c9cacf; }
      .muted { fill: #8f919a; }
      .faint-s { stroke: #4a4c53; }
      .signal { fill: #4cb782; }
      .signal-s { stroke: #4cb782; }
      .fail { fill: #f2865e; }
      .fail-s { stroke: #f2865e; }
      .fail-tint { fill: #2f1d16; }
      .badge { fill: #ececef; }
      .badge-t { fill: #0d0e10; }
    }
  </style>

  <defs>
    <path id="check" d="M -6 0 L -2 4.5 L 6.5 -5" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="lock">
      <rect x="0" y="7" width="16" height="12" rx="2.5"/>
      <path d="M 3.5 7.5 V 4.5 a 4.5 4.5 0 0 1 9 0 V 7.5" fill="none" stroke-width="2.5"/>
    </g>
  </defs>

  <rect class="bg" width="1200" height="740" rx="24"/>

  <!-- Outside: the usual cloud tools, down -->
  <g>
    <circle class="cloud" cx="398" cy="104" r="30"/>
    <circle class="cloud" cx="438" cy="86" r="40"/>
    <circle class="cloud" cx="480" cy="106" r="28"/>
    <rect class="cloud" x="368" y="98" width="140" height="36" rx="18"/>
    <text class="h2 ink" x="530" y="94">Your usual cloud tools</text>
    <text class="b muted" x="530" y="120">Chat, email and meetings</text>
    <rect class="fail-tint" x="770" y="74" width="74" height="28" rx="14"/>
    <text class="pill fail" x="807" y="93.5" text-anchor="middle">Down</text>
  </g>

  <!-- The usual line, broken -->
  <path class="faint-s" d="M 300 260 L 300 170 C 300 138, 322 122, 362 120" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <circle class="fail-tint" cx="300" cy="166" r="17"/>
  <path class="fail-s" d="M 293.5 159.5 L 306.5 172.5 M 306.5 159.5 L 293.5 172.5" fill="none" stroke-width="3.5" stroke-linecap="round"/>
  <text class="b muted" x="274" y="172" text-anchor="end">The usual line</text>

  <!-- Your office network -->
  <rect class="zone" x="40" y="196" width="1120" height="470" rx="22"/>
  <text class="h3 ink" x="72" y="236">Your office network</text>
  <text class="b muted" x="1128" y="236" text-anchor="end">No internet connection needed</text>

  <!-- 3: Staff computers -->
  <rect class="card" x="76" y="260" width="340" height="376" rx="18"/>
  <g class="ink">
    <g transform="translate(104 292)">
      <rect class="ink-s" x="0" y="0" width="46" height="30" rx="4" fill="none" stroke-width="3"/>
      <rect x="-7" y="34" width="60" height="5" rx="2.5"/>
    </g>
    <g transform="translate(166 292)">
      <rect class="ink-s" x="0" y="0" width="46" height="30" rx="4" fill="none" stroke-width="3"/>
      <rect x="-7" y="34" width="60" height="5" rx="2.5"/>
    </g>
    <g transform="translate(228 292)">
      <rect class="ink-s" x="0" y="0" width="46" height="30" rx="4" fill="none" stroke-width="3"/>
      <rect x="-7" y="34" width="60" height="5" rx="2.5"/>
    </g>
  </g>
  <circle class="badge" cx="388" cy="290" r="14"/>
  <text class="num badge-t" x="388" y="295.5" text-anchor="middle">3</text>
  <text class="h ink" x="104" y="372">Staff computers</text>
  <text class="b muted" x="104" y="400">The SpareLine app on each one</text>
  <line class="rule" x1="104" y1="424" x2="388" y2="424"/>
  <use href="#check" class="signal-s" x="112" y="452"/>
  <text class="b ink2" x="132" y="458">Joins with a one-time invite</text>
  <use href="#check" class="signal-s" x="112" y="486"/>
  <text class="b ink2" x="132" y="492">Checks it's the real server</text>
  <rect class="seal" x="100" y="516" width="292" height="98" rx="12"/>
  <use href="#lock" class="signal signal-s" transform="translate(120 533)"/>
  <text class="h3 ink" x="146" y="550">Encrypted on each computer</text>
  <text class="s muted" x="120" y="578">Sealed before they're sent</text>
  <text class="s muted" x="120" y="602">History is stored encrypted</text>

  <!-- 4: The spare line -->
  <text class="h ink" x="600" y="336" text-anchor="middle">The spare line</text>
  <circle class="badge" cx="706" cy="328" r="14"/>
  <text class="num badge-t" x="706" y="333.5" text-anchor="middle">4</text>
  <text class="b muted" x="600" y="364" text-anchor="middle">Between staff and the server</text>
  <line class="signal-s" x1="428" y1="412" x2="764" y2="412" stroke-width="5" stroke-linecap="round"/>
  <path class="signal" d="M 762 403 L 778 412 L 762 421 Z"/>
  <line class="signal-s" x1="436" y1="438" x2="772" y2="438" stroke-width="5" stroke-linecap="round"/>
  <path class="signal" d="M 438 429 L 422 438 L 438 447 Z"/>
  <rect class="chip" x="512" y="403" width="176" height="44" rx="22"/>
  <use href="#lock" class="signal signal-s" transform="translate(532 415)"/>
  <text class="pill ink" x="558" y="430.5">Sealed message</text>
  <text class="h3 ink" x="600" y="500" text-anchor="middle">Encrypted connection</text>
  <text class="s muted" x="600" y="526" text-anchor="middle">TLS on port 7443</text>
  <text class="s muted" x="600" y="550" text-anchor="middle">Locked to the server's certificate</text>
  <text class="s muted" x="600" y="574" text-anchor="middle">The app finds the server by itself</text>

  <!-- 1: SpareLine Server -->
  <rect class="card" x="784" y="260" width="340" height="376" rx="18"/>
  <g transform="translate(812 290)">
    <rect class="ink-s" x="0" y="0" width="72" height="22" rx="5" fill="none" stroke-width="3"/>
    <rect class="ink-s" x="0" y="28" width="72" height="22" rx="5" fill="none" stroke-width="3"/>
    <circle class="signal" cx="14" cy="11" r="4.5"/>
    <circle class="signal" cx="14" cy="39" r="4.5"/>
    <path class="faint-s" d="M 42 11 H 60 M 42 39 H 60" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle class="badge" cx="1096" cy="290" r="14"/>
  <text class="num badge-t" x="1096" y="295.5" text-anchor="middle">1</text>
  <text class="h ink" x="812" y="372">SpareLine Server</text>
  <text class="b muted" x="812" y="400">One computer in your office</text>
  <line class="rule" x1="812" y1="424" x2="1096" y2="424"/>
  <use href="#check" class="signal-s" x="820" y="452"/>
  <text class="b ink2" x="840" y="458">Passes on sealed messages</text>
  <use href="#check" class="signal-s" x="820" y="486"/>
  <text class="b ink2" x="840" y="492">Holds them for offline devices</text>
  <rect class="inner" x="808" y="516" width="292" height="98" rx="12"/>
  <g transform="translate(828 535)" class="ink-s" fill="none" stroke-width="2.2">
    <rect x="0" y="0" width="18" height="15" rx="3"/>
    <path d="M 6.5 0.5 V 14.5"/>
  </g>
  <text class="h3 ink" x="854" y="550">Control panel</text>
  <circle class="badge" cx="1076" cy="544" r="14"/>
  <text class="num badge-t" x="1076" y="549.5" text-anchor="middle">2</text>
  <text class="s muted" x="828" y="578">Invites, groups and health</text>
  <text class="s muted" x="828" y="602">No way to read messages</text>

  <!-- Legend -->
  <use href="#lock" class="signal signal-s" transform="translate(76 688)"/>
  <text class="b ink2" x="102" y="704">Only the people in a chat can read its messages</text>
  <text class="b muted" x="1124" y="704" text-anchor="end">The server sees who, when and how much, never what</text>
</svg>
